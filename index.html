addLib(0,'info',0,'How Caves Form',
'Caves are hollow spaces under the ground, and many of them begin as solid rock. In some places, the rock is limestone, which water can slowly dissolve. Rainwater picks up a little carbon dioxide from the air and soil, which makes it slightly acidic. When this water trickles down into cracks in the limestone, it eats away at the rock a tiny bit at a time.\nOver thousands of years, the cracks grow into tunnels, and the tunnels grow into large rooms. Some caves even have underground rivers that keep carving new passages. When the water level drops, air fills the empty spaces, and a cave is born.\nInside a cave, dripping water leaves behind minerals. Stalactites hang from the ceiling like stone icicles. Stalagmites grow upward from the floor where the drops land. Both grow very slowly, often less than an inch in a hundred years. When a stalactite and a stalagmite finally meet, they form a column.\nCaves are home to special animals, such as bats, blind fish, and cave crickets. These animals do not need much light, so many have adapted to life in the dark. Scientists who study caves are called speleologists, and they explore these hidden places to learn about Earth’s history.',
[['m','Caves form slowly when water dissolves rock, and special features and animals are found inside.','Stalactites hang from the ceiling.','Rocks are all around us.','Bats are the most important cave animals.'],
['e','Caves take a very long time to form.','Over thousands of years, the cracks grow into tunnels, and the tunnels grow into large rooms.',['Caves are hollow spaces under the ground.','Stalactites hang from the ceiling like stone icicles.','Scientists who study caves are called speleologists.']],
['v','adapted','changed to live well in a place','These animals do not need much light, so many have adapted to life in the dark.',['moved far away','grown very large','become dangerous']],
['i','Why do stalactites and stalagmites grow so slowly?','Each drip leaves behind only a tiny amount of mineral.',['Caves are too warm.','Bats eat the minerals.','They stop growing when scientists visit.'],'Dripping water leaves minerals, and they grow less than an inch in a hundred years.'],
['x','cause and effect']]);

addLib(0,'info',1,'How Animated Movies Are Made',
'Animated movies may look like magic, but they are made with hard work and careful planning. Every movie begins with an idea. Writers turn the idea into a story, and artists draw simple pictures called storyboards that show what happens in each scene.\nNext, artists create the characters and settings. In older animated films, artists drew every picture by hand. A movie that lasts ninety minutes needs more than a hundred thousand drawings, because each second of film shows twenty-four pictures. When the pictures are shown quickly one after another, they seem to move.\nToday, many animated movies are made on computers. Artists build characters as digital models and use software to make them move. Even so, animators still study how real people and animals move so their characters feel believable.\nWhile animators work, actors record the voices for the characters. Sound artists add music and noises, such as footsteps and doors closing. Finally, all the pieces are put together, and the movie is ready for the theater.\nMaking an animated movie can take four or five years and hundreds of people. Each person’s job is a small piece of a very big puzzle.',
[['m','Animated movies are made through many steps and the work of many people.','Actors record the voices for the characters.','People enjoy movies.','Hand drawing is better than using computers.'],
['e','Animated movies take a long time to make.','Making an animated movie can take four or five years and hundreds of people.',['Every movie begins with an idea.','Actors record the voices for the characters.','Today, many animated movies are made on computers.']],
['v','believable','easy to accept as real','Even so, animators still study how real people and animals move so their characters feel believable.',['too small to see','very loud','difficult to draw']],
['i','Why does an animated movie need so many drawings?','Each second of film shows many pictures.',['Artists like to draw.','Movies are very short.','Actors need pictures.'],'Each second of film shows twenty-four pictures.'],
['x','sequence']]);

addLib(0,'info',2,'How Dogs Talk Without Words',
'Dogs cannot use words, but they “talk” all day long with their bodies and voices. People who understand dog language can tell a lot about how a dog feels.\nA wagging tail often means a dog is excited, but it does not always mean happy. A loose, wide wag usually shows friendliness. A stiff, high tail can be a sign that the dog is alert or uncertain. The position of the ears matters too. Ears that are up and forward show interest. Ears pinned back can mean fear.\nOne of the most famous dog signals is the play bow. A dog drops its front legs, keeps its back end in the air, and wiggles. This pose means, “Let’s play!” Dogs also pant, yawn, and lick their lips when they feel nervous.\nBarking is another way dogs speak. A short, sharp bark can be a warning. A long, high-pitched bark may mean the dog is lonely or wants attention. Dogs also whine, growl, and howl, and each sound has its own meaning.\nWhen people learn to read these signals, they can keep dogs safe and build trust. A calm, happy dog is easier to train, and it makes a better friend.',
[['m','Dogs communicate with their bodies and sounds, and people can learn to understand them.','A play bow means “Let’s play!”','Animals can communicate.','Dogs are smarter than cats.'],
['e','A wagging tail does not always mean a dog is happy.','A stiff, high tail can be a sign that the dog is alert or uncertain.',['Dogs also whine, growl, and howl.','The position of the ears matters too.','A short, sharp bark can be a warning.']],
['v','alert','watchful and ready','A stiff, high tail can be a sign that the dog is alert or uncertain.',['sleepy','hungry','friendly']],
['i','What might a dog be feeling if it licks its lips and yawns?','nervous',['sleepy only','hungry for lunch','excited to play'],'Dogs pant, yawn, and lick their lips when they feel nervous.'],
['p','to inform']]);

addLib(0,'info',3,'How Muscles Get Stronger',
'Muscles are bundles of tiny fibers that help the body move. Every time you walk, lift a backpack, or smile, muscles are at work. When you exercise, you can make your muscles stronger.\nStrength training, such as lifting weights or doing push-ups, puts stress on muscle fibers. The stress causes tiny tears in the fibers. This may sound harmful, but it is a normal part of getting stronger. During rest, the body repairs the tears and builds the fibers back a little thicker than before.\nThat is why rest is just as important as exercise. Athletes often take rest days so their muscles can recover. Sleep matters too, because the body does much of its repair work at night.\nFood also helps muscles grow. Protein, found in foods like eggs, beans, and chicken, gives the body the building blocks it needs to repair muscle fibers. Water helps muscles work well and keeps the body from getting tired too quickly.\nStronger muscles do more than make a person look fit. They protect joints, improve balance, and make everyday tasks easier. With steady practice, healthy food, and plenty of rest, anyone can build strength over time.',
[['m','Muscles get stronger through exercise, rest, and good food.','Protein is found in eggs, beans, and chicken.','Exercise is good for everyone.','Weights are the only way to exercise.'],
['e','Rest is important for building muscle.','During rest, the body repairs the tears and builds the fibers back a little thicker than before.',['Muscles are bundles of tiny fibers that help the body move.','Strength training puts stress on muscle fibers.','Water helps muscles work well.']],
['v','recover','get better after being tired or hurt','Athletes often take rest days so their muscles can recover.',['lose strength','grow tired','stay hidden']],
['i','Why might an athlete take a rest day?','Resting lets muscles repair and grow stronger.',['Rest makes muscles disappear.','Athletes do not like exercise.','Muscles only grow at the gym.'],'During rest, the body repairs the tears and builds the fibers back thicker.'],
['x','cause and effect']]);

addLib(0,'info',4,'How Sailors Find Their Way',
'Long ago, sailors had no phones or satellites to show them where they were. They had to find their way across the ocean using clever tools and careful observation.\nOne of the oldest tools is the compass. A compass has a magnetized needle that always points toward Earth’s north. When sailors know which way is north, they can tell which way they are heading. Compasses worked in cloudy weather and at night, which made them very helpful.\nSailors also used the stars. In the Northern Hemisphere, the North Star stays almost in the same spot in the sky. By finding it, a sailor could tell the direction north and estimate how far north or south the ship had traveled.\nMaps and charts showed coastlines, islands, and dangerous rocks. Sailors marked their positions on these charts and planned their routes. They also measured the ship’s speed by tossing a knotted rope into the water and counting the knots that passed in a certain time. That is why a ship’s speed is still measured in knots today.\nModern ships use satellites and computers to find their location. Even so, many sailors still learn to use a compass and stars in case their electronics fail.',
[['m','Sailors have used many tools to find their way across the ocean.','A compass has a magnetized needle.','Ships travel on water.','Satellites are better than stars.'],
['e','Compasses were very useful at sea.','Compasses worked in cloudy weather and at night, which made them very helpful.',['A compass has a magnetized needle that always points toward Earth’s north.','Maps and charts showed coastlines, islands, and dangerous rocks.','Modern ships use satellites and computers to find their location.']],
['v','estimate','make a careful guess about an amount','By finding it, a sailor could tell the direction north and estimate how far north or south the ship had traveled.',['know exactly','forget','measure with a ruler']],
['i','Why do many sailors still learn to use a compass today?','Electronics might fail.',['Compasses are newer than satellites.','Satellites do not work on land.','Ships cannot carry computers.'],'Sailors learn them in case their electronics fail.'],
['p','to inform']]);

addLib(0,'info',5,'How Computer Programs Work',
'A computer program is a set of instructions that tells a computer what to do. Computers follow instructions exactly, even when the instructions are silly. That is why programmers must be careful and clear.\nProgrammers write instructions in special languages that computers can understand. Some of these languages are named Python, Scratch, and JavaScript. Each language has rules, just like English has rules for sentences. If a programmer breaks a rule, the computer may not understand.\nPrograms often use steps called loops and conditions. A loop repeats an action, such as drawing a square by moving forward and turning four times. A condition makes a choice. For example, “If the player touches the coin, add one point.”\nAlmost every program has mistakes at first. A mistake in a program is called a bug. Programmers find and fix bugs by testing the program again and again. They read their instructions carefully and try small changes until everything works.\nPrograms are all around us. They run video games, traffic lights, phones, and even microwave ovens. Learning to code is like learning a new way to solve problems, one small step at a time.',
[['m','Computer programs are instructions that programmers write, test, and fix.','A loop repeats an action.','Computers are everywhere.','Python is the best language.'],
['e','Programmers must be careful and clear.','Computers follow instructions exactly, even when the instructions are silly.',['Some of these languages are named Python, Scratch, and JavaScript.','A mistake in a program is called a bug.','Programs run video games, traffic lights, phones, and microwave ovens.']],
['v','condition','a rule that makes a program choose','A condition makes a choice. For example, “If the player touches the coin, add one point.”',['a place to store files','a type of computer','the end of a program']],
['i','What would a programmer most likely do after finding a bug?','test small changes until it works',['throw away the computer','ignore it','add more bugs'],'Programmers find and fix bugs by testing and trying small changes.'],
['p','to inform']]);

addLib(0,'info',6,'How Parachutes and Gliders Work',
'A parachute helps a person fall slowly and land safely. How can a piece of fabric do that? The answer is air.\nWhen something falls, the air pushes back against it. This push is called air resistance. A small, heavy object, like a rock, has little surface for the air to push on, so it falls fast. A large, light object, like a feather, has more surface for its weight and falls slowly.\nA parachute is made to catch as much air as possible. When the parachute opens, it fills like a giant bowl. The air pushes up against the wide fabric, which slows the fall. The parachute lets the jumper float down gently instead of dropping quickly.\nGliders work in a different way. A glider has long, wide wings. As the glider moves forward, air flows over and under the wings. The shape of the wings creates lift, an upward push that holds the glider in the air. Pilots can steer by tilting the wings and the tail.\nBoth parachutes and gliders use the way air pushes on objects. Engineers test new designs in wind tunnels, where fans blow air past models. Careful testing helps make flying safer.',
[['m','Parachutes and gliders use air to slow a fall or stay up.','Gliders have long, wide wings.','Flying is fun.','Rocks fall faster than feathers on the Moon.'],
['e','Air resistance makes a feather fall slowly.','A large, light object, like a feather, has more surface for its weight and falls slowly.',['A small, heavy object, like a rock, falls fast.','Pilots can steer by tilting the wings and the tail.','Engineers test new designs in wind tunnels.']],
['v','resistance','a push that works against motion','When something falls, the air pushes back against it. This push is called air resistance.',['a kind of weather','a type of fabric','a loud sound']],
['i','Why does a parachute slow a jumper’s fall?','It catches air that pushes up on the fabric.',['It makes the jumper lighter.','It pushes the jumper down.','It blocks the sunlight.'],'The air pushes up against the wide fabric, which slows the fall.'],
['x','cause and effect']]);

addLib(0,'info',7,'How Volleyball Is Played',
'Volleyball is a team sport played on a court divided by a high net. Two teams try to hit the ball over the net so that it lands on the other team’s side. Each team has six players on the court at a time.\nA rally starts with a serve. The server hits the ball over the net from behind the back line. The other team then tries to send the ball back. A team may touch the ball up to three times before it must go over the net. Usually the first touch is a pass, called a bump. The second is a set, which lifts the ball near the net. The third is a spike, a hard hit that drives the ball down.\nA team scores a point when the ball lands on the other side or when the other team makes a mistake. In most games, the first team to reach twenty-five points, and lead by two, wins the set. Matches are often the best of three or five sets.\nPlayers rotate positions in a set order each time their team wins the serve back. This means everyone gets a chance to play at the net and in the back row. One special player, called the libero, wears a different color shirt and focuses on defense.\nVolleyball needs quick thinking and teamwork. Players cheer for each other after every point, good or bad.',
[['m','Volleyball is a team sport with set rules for hitting the ball over a net.','A team may touch the ball three times.','Sports are played on courts.','The libero is the best player.'],
['e','Teams use up to three touches to send the ball over the net.','A team may touch the ball up to three times before it must go over the net.',['Each team has six players on the court at a time.','A rally starts with a serve.','The libero wears a different color shirt.']],
['v','rotate','move in a set order','Players rotate positions in a set order each time their team wins the serve back.',['sit down','jump high','hit hard']],
['i','Why do players rotate positions?','so everyone plays at the net and in the back row',['so the ball stays in the air','so the court looks neater','so the libero can leave'],'Rotation means everyone gets a chance to play at the net and in the back row.'],
['p','to inform']]);

addLib(0,'info',8,'Caring for a Horse',
'Owning a horse is a big responsibility. A horse needs care every single day, no matter the weather.\nFood and water come first. Horses eat hay, grass, and sometimes grain. A full-grown horse can drink five to ten gallons of water in a day, so its water must always be fresh and clean. Owners should feed horses at the same times each day because their stomachs work best on a steady schedule.\nHorses also need exercise. In a pasture, they walk, trot, and graze, which keeps their bodies strong. Riding and training are other ways for horses to stay active, but owners must be careful not to tire them out.\nGrooming keeps a horse healthy and comfortable. Brushing removes dirt and loose hair and helps the owner spot cuts or bumps. A horse’s hooves need to be cleaned with a hoof pick, and about every six to eight weeks a farrier trims them and fits horseshoes.\nFinally, horses need a safe shelter, regular visits from a veterinarian, and plenty of attention. Horses are social animals, so they are happiest with friends. A well-cared-for horse can live for twenty-five years or more.',
[['m','Horses need many kinds of daily care to stay healthy.','A farrier trims a horse’s hooves.','Animals need care.','Riding is the most important part of caring for a horse.'],
['e','Water is very important for horses.','A full-grown horse can drink five to ten gallons of water in a day, so its water must always be fresh and clean.',['Horses eat hay, grass, and sometimes grain.','Brushing removes dirt and loose hair.','Horses are social animals, so they are happiest with friends.']],
['v','grooming','cleaning and brushing an animal','Grooming keeps a horse healthy and comfortable.',['feeding with grain','racing quickly','teaching to jump']],
['i','Why might an owner notice a cut while brushing a horse?','Brushing lets the owner see the horse’s skin and coat up close.',['Horses cut themselves while eating.','The brush causes cuts.','The farrier causes cuts.'],'Brushing helps the owner spot cuts or bumps.'],
['p','to inform']]);

addLib(0,'info',9,'The Axolotl: A Salamander That Stays Young',
'The axolotl is a salamander that lives in only one place in the wild: a few lakes and canals near Mexico City. Most salamanders live in water when they are young and move onto land as adults. The axolotl is different. It keeps its feathery gills and spends its whole life in water. Scientists call this staying young while growing up.\nAxolotls have wide heads, small eyes, and long tails. Their bodies come in many colors, including brown, gray, and pink. The frills on the sides of their heads are gills, which they use to take in oxygen from the water.\nAn axolotl’s most amazing skill is regrowing parts of its body. If an axolotl loses a leg, a new one can grow back. It can even regrow parts of its heart and brain. Scientists study axolotls to learn if people might someday heal in similar ways.\nIn the wild, axolotls are now in danger. Their lakes have shrunk, the water has become polluted, and larger fish have been added that eat them. Conservation groups are working to protect the water and to bring axolotls back.\nAxolotls eat small animals such as worms, insects, and tiny fish. They hunt by sucking prey into their mouths with a quick gulp. Though they look gentle, they are skilled hunters.',
[['m','Axolotls are unusual salamanders that live in water, regrow body parts, and are endangered.','Axolotls eat worms and insects.','Salamanders are amphibians.','Axolotls make good pets for everyone.'],
['e','Axolotls are in danger in the wild.','Their lakes have shrunk, the water has become polluted, and larger fish have been added that eat them.',['Axolotls have wide heads, small eyes, and long tails.','Axolotls eat small animals such as worms, insects, and tiny fish.','If an axolotl loses a leg, a new one can grow back.']],
['v','polluted','dirty and harmful','Their lakes have shrunk, the water has become polluted, and larger fish have been added that eat them.',['very deep','very cold','full of plants']],
['i','Why do scientists study axolotls?','They hope to learn how people might heal.',['They want to sell axolotls.','They want to teach axolotls to hunt.','Axolotls help fish swim.'],'Scientists study axolotls to learn if people might someday heal in similar ways.'],
['p','to inform']]);

addLib(0,'info',10,'Why Ducks Stay Dry',
'If you have ever watched a duck paddle through a rainstorm, you may have wondered how it stays dry. The secret is in the duck’s feathers.\nA duck has two layers of feathers. The outer layer is made of strong feathers that overlap like shingles on a roof. The inner layer is soft, fluffy down that traps warm air next to the duck’s skin. Together, the layers keep water out and warmth in.\nDucks also have a special gland near the base of the tail that makes a waxy oil. A duck uses its bill to spread the oil over its feathers. This process is called preening. The oil makes water bead up and roll right off, just like rain on a freshly waxed car.\nPreening takes a lot of time. Ducks may spend hours each day cleaning and arranging their feathers. If the feathers get messy, they will not keep the duck dry or warm.\nDucks have other helpful features, too. Their webbed feet work like paddles, and their wide bills let them scoop food from the water. Thanks to these special parts, ducks can live happily on ponds, lakes, and rivers all year round.',
[['m','Ducks stay dry because of their special feathers and oil.','Ducks have webbed feet.','Birds live in many places.','Ducks only swim in ponds.'],
['e','Preening is important for ducks.','If the feathers get messy, they will not keep the duck dry or warm.',['A duck has two layers of feathers.','Their webbed feet work like paddles.','Ducks may spend hours each day cleaning and arranging their feathers.']],
['v','preening','a duck cleaning and spreading oil on its feathers','A duck uses its bill to spread the oil over its feathers. This process is called preening.',['a duck diving for food','a duck sleeping','a duck flying south']],
['i','Why does water roll off a duck’s feathers?','The oil makes water bead up.',['The feathers are made of plastic.','Ducks shake the water off first.','The feathers are very thin.'],'The oil makes water bead up and roll right off.'],
['x','description']]);

addLib(0,'info',11,'The Amazing Strength of Spider Silk',
'Spiders spin silk that is one of the strongest natural materials on Earth. Pound for pound, some spider silk is stronger than steel. It is also stretchy, which means it can absorb the force of a flying insect without snapping.\nA spider makes silk inside its body. Tiny openings on the spider’s abdomen, called spinnerets, push out the liquid silk, which hardens into thread as it meets the air. Spiders can make different types of silk for different jobs. Some silk is sticky and used to trap prey. Other silk is smooth and strong and forms the frame of the web.\nSpiders use silk for more than catching food. They wrap their eggs in silk sacs to protect them. Some spiders use silk threads as safety lines when they drop from high places. Young spiders of some kinds release long silk threads that catch the wind and carry them to new homes, a trip called ballooning.\nScientists are fascinated by spider silk. They hope to make materials as strong and light as silk for things like bandages, fishing nets, and even protective clothing. So far, copying spider silk has been very difficult.\nThe next time you see a spider web glittering with morning dew, remember that each thin thread is a marvel of nature.',
[['m','Spider silk is strong and useful, and scientists want to copy it.','Spiders wrap their eggs in silk sacs.','Spiders are common animals.','Spiders can fly like birds.'],
['e','Spiders use silk in many ways.','They wrap their eggs in silk sacs to protect them.',['Pound for pound, some spider silk is stronger than steel.','Scientists are fascinated by spider silk.','So far, copying spider silk has been very difficult.']],
['v','fascinated','very interested','Scientists are fascinated by spider silk.',['afraid','bored','confused']],
['i','Why might spider silk be useful in fishing nets?','It is strong and light.',['It is sticky like glue.','It is heavy and rough.','It melts in water.'],'Scientists hope to make materials as strong and light as silk for things like fishing nets.'],
['p','to inform']]);

addLib(0,'info',12,'How Stars Shine',
'On a clear night, thousands of stars twinkle in the sky. Each star is a gigantic ball of hot gas, and our own Sun is one of them. Stars look tiny only because they are so far away.\nInside a star, gravity squeezes the gas toward the center. This squeezing makes the center extremely hot and dense. At these high temperatures, tiny parts of atoms smash together in a process called nuclear fusion. Fusion releases enormous amounts of energy as light and heat. That energy travels across space and reaches our eyes.\nStars come in different sizes and colors. The hottest stars look blue or white. Cooler stars look orange or red. Our Sun is a medium-sized yellow star. Some stars are so large that thousands of Suns could fit inside them.\nStars do not last forever. A star like our Sun shines for about ten billion years. When it runs out of fuel, it swells, cools, and slowly fades. Very large stars may end in a giant explosion called a supernova.\nAstronomers learn about stars by studying their light. Telescopes collect the light, and scientists measure its color and brightness to figure out how hot, big, and far away a star is.',
[['m','Stars shine because of fusion in their centers, and they come in different kinds.','Our Sun is a medium-sized yellow star.','Space is very large.','Stars are small balls of fire.'],
['e','Stars have different temperatures.','The hottest stars look blue or white.',['Stars look tiny only because they are so far away.','A star like our Sun shines for about ten billion years.','Telescopes collect the light.']],
['v','gigantic','extremely large','Each star is a gigantic ball of hot gas, and our own Sun is one of them.',['very small','cold','quick']],
['i','Why do stars look small from Earth?','They are very far away.',['They are tiny balls.','They are made of ice.','They are close to the Moon.'],'Stars look tiny only because they are so far away.'],
['x','cause and effect']]);

addLib(0,'info',13,'How Deep Breathing Helps Athletes Focus',
'Before a big race or a tough test, many people take a few deep breaths. Slow, deep breathing may seem simple, but it can help both the body and the mind.\nWhen people feel nervous, their hearts beat faster and their breathing becomes quick and shallow. This is part of the body’s “fight or flight” response. Slow, deep breaths send a message to the brain that it is safe to relax. As a result, the heart rate slows, and muscles loosen.\nAthletes use breathing exercises to stay calm under pressure. One common method is called belly breathing. A person breathes in slowly through the nose, letting the belly rise like a balloon. Then the person breathes out slowly through the mouth. Counting to four on each breath helps keep the rhythm steady.\nBreathing also gives the body oxygen, which the muscles need to work. Deeper breaths bring in more air than short breaths do. Many martial arts teach students to match their breathing with their movements, which helps them stay balanced and focused.\nAnyone can practice deep breathing. It takes only a minute, and no equipment is needed. With practice, a few calm breaths can help a person feel ready for almost anything.',
[['m','Deep breathing helps people stay calm and focused.','Belly breathing means breathing in slowly through the nose.','Athletes practice many skills.','Breathing quickly makes you stronger.'],
['e','Nervous people breathe differently.','When people feel nervous, their hearts beat faster and their breathing becomes quick and shallow.',['One common method is called belly breathing.','Breathing also gives the body oxygen.','Anyone can practice deep breathing.']],
['v','shallow','not deep','When people feel nervous, their hearts beat faster and their breathing becomes quick and shallow.',['very loud','slow and deep','warm']],
['i','Why might counting during a breath help?','It keeps the rhythm steady.',['It makes the breath louder.','It makes the heart beat faster.','It uses up the oxygen.'],'Counting to four on each breath helps keep the rhythm steady.'],
['x','cause and effect']]);

addLib(0,'info',14,'How Athletes Train',
'Athletes do not become strong or fast by accident. They follow training plans that build their bodies and their skills a little bit at a time.\nA good plan includes several parts. Endurance training, such as long runs or swims, helps the heart and lungs work longer without getting tired. Strength training, such as lifting weights or doing push-ups, makes muscles stronger. Flexibility exercises, like stretching, help the body bend and move safely.\nAthletes also practice the skills of their sports. A basketball player may shoot hundreds of free throws, while a soccer player practices passing and dribbling. Repeating a movement many times teaches the body to do it smoothly without thinking.\nRest and food are just as important as exercise. Muscles repair themselves during rest, and healthy foods give athletes the energy they need. Most athletes sleep eight to ten hours a night and drink plenty of water.\nFinally, athletes set goals. They might aim to run a mile faster or to score more points in a season. Writing down goals and tracking progress keeps athletes motivated. Training takes patience, but every small step moves an athlete closer to the goal.',
[['m','Athletes train in many ways, including exercise, practice, rest, and goal setting.','Basketball players shoot free throws.','Sports are popular.','Athletes only need to practice their sport.'],
['e','Practice helps athletes perform movements smoothly.','Repeating a movement many times teaches the body to do it smoothly without thinking.',['A basketball player may shoot hundreds of free throws.','Most athletes sleep eight to ten hours a night.','Writing down goals keeps athletes motivated.']],
['v','endurance','the ability to keep going for a long time','Endurance training, such as long runs or swims, helps the heart and lungs work longer without getting tired.',['the ability to jump high','a kind of food','a fast start']],
['i','Why might an athlete track progress?','It helps keep the athlete motivated.',['It makes workouts shorter.','It replaces sleep.','It removes the need to practice.'],'Writing down goals and tracking progress keeps athletes motivated.'],
['p','to inform']]);

addLib(1,'info',null,'The Science of Sleep',
'Most people think of sleep as a time when the body shuts off, but scientists have discovered that the brain is busy all night. During sleep, the brain moves through repeating cycles of light sleep, deep sleep, and a stage called REM sleep, when dreams are most vivid. Each cycle lasts about ninety minutes, and a full night includes four or five of them.\nDeep sleep is when the body does much of its repair work. Muscles recover, the immune system strengthens, and growth hormones are released. REM sleep seems to play a different role. During this stage, the brain sorts through the day’s experiences, strengthening important memories and letting go of unimportant details. Students who sleep well after studying often remember more than students who stay up late cramming.\nTeenagers need about eight to ten hours of sleep each night, yet surveys show that many get far less. One reason is biology. During the teenage years, the body’s internal clock shifts later, making it natural to feel awake at night and sleepy in the morning. Early school start times collide with this shift. In several districts that moved start times later, researchers reported better attendance, higher grades, and fewer car accidents among teen drivers.\nLack of sleep affects more than grades. Tired people have slower reactions, trouble concentrating, and a harder time controlling their emotions. Over time, poor sleep is linked to health problems such as weight gain and weakened immunity.\nMany teens rely on caffeine to push through the day, but caffeine can stay in the body for hours. A soda in the afternoon may still be affecting the brain at bedtime, making it harder to fall asleep. The cycle can repeat: less sleep leads to more caffeine, and more caffeine leads to less sleep. Breaking it often starts with swapping late-day caffeine for water.\nExperts suggest simple habits for better sleep. Going to bed and waking up at the same times each day helps the internal clock stay steady. Dimming lights and putting away screens an hour before bed signals the brain that night is coming. A cool, quiet room also helps. Small changes like these can lead to deeper sleep and better days.',
[['m','Sleep is an active process that affects learning and health, and good habits can improve it.','Teenagers need eight to ten hours of sleep.','Sleep is important.','Schools should start much later.'],
['e','Sleep helps with memory.','During this stage, the brain sorts through the day’s experiences, strengthening important memories and letting go of unimportant details.',['Each cycle lasts about ninety minutes.','Teenagers need about eight to ten hours of sleep each night.','A cool, quiet room also helps.']],
['v','vivid','strong and clear','During REM sleep, dreams are most vivid.',['faint and fuzzy','short and quiet','scary and loud']],
['i','Why might early school start times be a problem for teenagers?','Teen bodies naturally feel sleepy later in the morning.',['Teenagers dislike school.','Teenagers need no sleep.','Early mornings are always dangerous.'],'The body’s internal clock shifts later during the teenage years.'],
['x','cause and effect'],
['p','to inform']]);

addLib(1,'info',null,'The Rise of the Electric Car',
'When the first cars appeared more than a century ago, many were electric. Quiet and easy to start, they were popular among city drivers. But gasoline engines soon won out. Gasoline was cheap, and gas cars could travel much farther on a single fill-up. For almost a hundred years, electric cars were a rare sight.\nToday, they are making a comeback. One reason is battery technology. Modern lithium-ion batteries store far more energy than older ones, allowing many electric cars to travel more than two hundred miles on a charge. Charging networks have also grown, with stations in parking lots, along highways, and even at some grocery stores.\nSupporters point to several advantages. Electric cars produce no exhaust when they are driving, which helps keep city air cleaner. They also have fewer moving parts than gas engines, so they often need less maintenance. And although electric cars can cost more to buy, many drivers save money on fuel.\nCritics, however, raise important questions. Making batteries requires mining metals such as lithium and cobalt, which can harm the environment and, in some places, raise concerns about working conditions. Recycling old batteries is still developing. In addition, an electric car is only as clean as the electricity that charges it. If the power comes from coal, the benefits are smaller than if it comes from wind or solar energy.\nGovernments are also shaping the market. Some offer tax credits to buyers of electric cars, while others have set dates after which only zero-emission vehicles may be sold. These policies can speed up change, but they also raise debates about fairness, since electric cars still cost more than many families can afford. Supporters say prices will fall as production grows, as they did with earlier technologies such as flat-screen televisions.\nMost experts agree that electric cars are an important step, but not a complete answer. Improving public transportation, building cleaner power plants, and designing better batteries will all be needed. The story of the electric car shows how technology can change, return, and keep changing again.',
[['m','Electric cars have returned thanks to better batteries, but they come with both benefits and challenges.','Electric cars produce no exhaust when driving.','Cars have changed over time.','Gasoline will run out soon.'],
['e','Battery technology has improved.','Modern lithium-ion batteries store far more energy than older ones, allowing many electric cars to travel more than two hundred miles on a charge.',['Charging networks have also grown.','Electric cars produce no exhaust when they are driving.','Most experts agree that electric cars are an important step.']],
['v','maintenance','the work of keeping something in good shape','They also have fewer moving parts than gas engines, so they often need less maintenance.',['the cost of buying something','the speed of a vehicle','a place to park']],
['i','Why might an electric car be less clean if it is charged with power from coal?','The electricity itself creates pollution.',['Coal makes the car heavier.','Coal breaks the battery.','Electric cars cannot use coal.'],'An electric car is only as clean as the electricity that charges it.'],
['x','compare and contrast'],
['p','to inform']]);

addLib(1,'info',null,'Coral Reefs: Cities Under the Sea',
'From above, a coral reef can look like a rocky garden of many colors. But a reef is alive. It is built by tiny animals called coral polyps, which grow hard skeletons of limestone around their soft bodies. Over thousands of years, billions of polyps build on top of one another, creating huge structures that can be seen from space.\nReefs cover less than one percent of the ocean floor, yet they support about a quarter of all marine species. Fish hide among the branches, sea turtles graze on seagrass nearby, and sharks patrol the edges. Because so many animals depend on them, reefs are often called the rainforests of the sea.\nCorals get much of their energy from a partnership with algae, tiny plants that live inside their tissues. The algae use sunlight to make food and share it with the coral, and in return the coral gives the algae a safe home and the nutrients it needs. The algae also give corals their bright colors.\nThis partnership is fragile. When ocean water becomes too warm, corals push out the algae. Without them, the coral turns white, a process called bleaching. A bleached coral is not dead yet, but it is starving. If the water cools quickly enough, the algae may return. If not, the coral dies, and the animals that depended on it lose their homes.\nNot all threats come from warming. Runoff from farms and cities carries fertilizer and sediment onto reefs, clouding the water so less sunlight reaches the algae. Some fishing methods, such as using explosives, destroy the reef’s structure outright. In several places, local communities have created protected areas where fishing is limited, and fish populations have rebounded within a few years.\nReefs also protect people. They act as barriers that absorb the force of waves, reducing damage from storms. They support fishing communities and attract tourists. Scientists and local groups are working to restore damaged reefs by growing corals in nurseries and planting them on the seafloor. Reducing pollution and slowing warming oceans are equally important if these underwater cities are to survive.',
[['m','Coral reefs support huge numbers of species, but warming water threatens them.','Reefs are built by tiny animals.','The ocean is full of life.','All coral reefs are already dead.'],
['e','Reefs are important homes for sea life.','Reefs cover less than one percent of the ocean floor, yet they support about a quarter of all marine species.',['Corals get much of their energy from a partnership with algae.','Reefs also protect people.','Scientists and local groups are working to restore damaged reefs.']],
['v','fragile','easily broken or harmed','This partnership is fragile.',['strong and long-lasting','bright and colorful','large and heavy']],
['i','Why does coral turn white during bleaching?','The coral has pushed out its algae.',['The coral has eaten too much.','The water has become too salty.','The coral has grown a new skeleton.'],'When ocean water becomes too warm, corals push out the algae.'],
['x','cause and effect'],
['p','to inform']]);

function libPass(p,ctx){var paras=p.text.split('\n').map(function(s){return '<p>'+libFill(s,ctx)+'</p>'}).join('');return '<div class="pass long"><b class="ptitle">'+libFill(p.title,ctx)+'</b>'+paras+'</div>'}
function libBuild(p,it,ctx){return LIBB[it[0]](libDeep(it,ctx))}
function libPlan(ids,UP,themes,seenFn,usedFn){var left=ids.slice(),units=[],guard=0;
 while(left.length&&guard++<8){var ti=(themes&&themes.length)?P(themes):-1,best=null;
  LIB.forEach(function(p){if(p.band!==(UP?1:0)||units.some(function(u){return u.pid===p.id}))return;var ctx=libCtx(ti),cov=[];
   Object.keys(p.by).forEach(function(sid){var cnt=left.filter(function(x){return x===sid}).length;if(!cnt)return;
    var cand=shuf(p.by[sid]).map(function(a){return libBuild(p,a,ctx)}).filter(function(o){return !seenFn(sid,o)});
    for(var k=0;k<Math.min(cnt,2)&&k<cand.length;k++)cov.push({sid:sid,o:cand[k]})});
   if(!cov.length)return;
   var tm=(p.th!==null&&themes&&themes.indexOf(p.th)>=0)?1.5:0,score=Math.min(cov.length,6)+tm+(usedFn&&usedFn(p.id)?0:.7)+Math.random()*.5;
   if(!best||score>best.score)best={p:p,ctx:ctx,cov:cov.slice(0,6),score:score}});
  if(!best)break;
  best.cov.forEach(function(c){var ix=left.indexOf(c.sid);if(ix>=0)left.splice(ix,1)});
  units.push({pid:best.p.id,pass:libPass(best.p,best.ctx),qs:best.cov})}
 return {units:units,left:left}}
function libOne(sid,UP,themes,seenFn,avoidPid){var ti=(themes&&themes.length)?P(themes):-1,cands=[];
 LIB.forEach(function(p){if(p.band!==(UP?1:0)||p.id===avoidPid||!p.by[sid])return;var ctx=libCtx(ti);shuf(p.by[sid]).forEach(function(a){var o=libBuild(p,a,ctx);if(!seenFn(sid,o))cands.push({pid:p.id,pass:libPass(p,ctx),o:o,sid:sid})})});
 return cands.length?P(cands):null}

 for(i=0;i<SK.length;i++)if(SK[i].codes&&SK[i].codes.indexOf(c)>=0)return SK[i].id;
 for(i=0;i<SK.length;i++)if(SK[i].codes)for(j=0;j<SK[i].codes.length;j++){sc=SK[i].codes[j];if(c.indexOf(sc+'.')===0||sc.indexOf(c+'.')===0)return SK[i].id}
 var lower=(it.desc||'').toLowerCase(),best=null,bs=0;SK.forEach(function(s){var q=0;s.kw.forEach(function(k){if(lower.indexOf(k)>=0)q+=k.length});if(q>bs){bs=q;best=s.id}});return bs>=9?best:null}
function readIt(){if(!DRAFT.n.trim()){toast('Type the student’s name first.');return}var items=parseReport(DRAFT.t);if(!items.length){toast('I could not find any standards. Paste the whole report, including the standard codes.');return}
 items.forEach(function(it){it.sid=matchItem(it);it.inc=!!it.sid&&/persistent|watch/i.test(it.st)});TMP={name:DRAFT.n.trim(),items:items};render()}
function makeQuiz(){var rows=TMP.items.map(function(it,i){return {code:it.code,t:it.desc,st:it.st,m:it.m,cause:it.cause,sid:$('sel'+i).value||null,inc:$('ck'+i).checked}});
 var s={name:TMP.name,rows:rows,man:[],read:false},n=skillsOf(s).length,hi=0,lo=0;rows.forEach(function(r){if(r.inc&&r.sid&&SKI[r.sid]&&SKI[r.sid].g==='R'){var gg=gradeOf(r.code);if(gg>=6)hi++;else if(gg>=3)lo++}});s.upper=hi>lo;var ea=0;rows.forEach(function(r){if(r.inc&&r.sid&&SKI[r.sid]&&SKI[r.sid].g==='E')ea=Math.max(ea,Math.min(2,gradeOf(r.code)))});s.early=ea;if(!n){toast('Check at least one standard that has a practice stop.');return}
 var ex=DB.roster.filter(function(r){return r.name.toLowerCase()===s.name.toLowerCase()})[0];if(ex){ex.rows=rows;ex.man=[];ex.upper=s.upper;ex.early=s.early}else{s.themes=[];DB.roster.push(s)}
 save();TMP=null;DRAFT.n='';DRAFT.t='';render();toast('Quiz ready')}
function cancelTmp(){TMP=null;render()}
function opts(sel){var h='<option value=""'+(!sel?' selected':'')+'>⚠ No practice yet</option>';[0,'E',3,4,5,6,7,8,'R'].forEach(function(g){h+='<optgroup label="'+(g==='E'?'Pictures: kindergarten to grade 2':g==='R'?'Reading and language, grades 3-8':g?'Grade '+g+' math':'Kindergarten')+'">';SK.forEach(function(s){if(s.g===g)h+='<option value="'+s.id+'"'+(sel===s.id?' selected':'')+'>'+(cl(s)?cl(s)+' · ':'')+esc(s.name)+'</option>'});h+='</optgroup>'});return h}
function vTeacher(){var h=topbar()+'<div class="tpage"><h2 class="tt">Teacher setup</h2>';
 h+='<section class="card"><h3>1. Add a student’s quiz</h3><label class="lab" for="sn">Student name</label><input id="sn" class="inp full" value="'+esc(DRAFT.n)+'" oninput="DRAFT.n=this.value" placeholder="First name">'+
 '<label class="lab" for="rp">Paste the skill-gap report</label><textarea id="rp" class="inp full ta" rows="7" oninput="DRAFT.t=this.value" placeholder="Paste the whole report here. Standards, status, and misses are read automatically.">'+esc(DRAFT.t)+'</textarea>'+
 '<button class="btn" onclick="readIt()">Read the report</button>';
 if(TMP){h+='<div class="map"><h3>Check what I found for '+esc(TMP.name)+'</h3><p class="sm">The quiz has '+NQ+' questions. Standards missed more often get more questions. Untick any you do not want.</p>';
  TMP.items.forEach(function(it,i){var sc='st-'+it.st.toLowerCase();h+='<div class="gap"><label class="ck"><input type="checkbox" id="ck'+i+'"'+(it.inc?' checked':'')+'><b>'+esc(it.code)+'</b><span class="chip '+sc+'">'+esc(it.st||'No status')+'</span><small>missed '+it.m+'×</small></label><div class="sm">'+esc(it.desc.slice(0,140))+(it.desc.length>140?'…':'')+'</div><select id="sel'+i+'" class="sel'+(it.sid?'':' w')+'" aria-label="Practice for '+esc(it.code)+'">'+opts(it.sid)+'</select>'+(it.cause?'<details><summary>Likely cause</summary><p class="sm">'+esc(it.cause)+'</p></details>':'')+'</div>'});
  h+='<div class="btns"><button class="btn" onclick="makeQuiz()">Create the quiz</button><button class="btn alt" onclick="cancelTmp()">Cancel</button></div></div>'}
 h+='</section><section class="card"><h3>2. Students</h3>';
 if(!DB.roster.length)h+='<p class="sm">No quizzes yet. Add one above.</p>';
 DB.roster.forEach(function(s,si){var c=counts(s),ids=Object.keys(c),n=ids.length;
  h+='<div class="stu"><div class="sh"><input class="inp nm" value="'+esc(s.name)+'" onchange="rename('+si+',this.value)" aria-label="Student name"><span class="chip">'+NQ+' questions</span></div>'+
  (n?'<div class="chips">'+ids.sort(function(a,b){return SKI[a].i-SKI[b].i}).map(function(id){return '<span class="chip">'+esc(cl(SKI[id])||SKI[id].name)+' × '+c[id]+'</span>'}).join('')+'</div>':'<p class="warn">No skills selected.</p>')+
  '<label class="ck"><input type="checkbox" '+(s.read?'checked':'')+' onchange="setSRead('+si+',this.checked)"> Start with “Read to me” on</label>'+(ids.some(function(id){return SKI[id].g==='R'})?'<label class="ck">Reading level <select class="sel" onchange="setUpper('+si+',this.value===\'1\')" aria-label="Reading level"><option value="0"'+(s.upper?'':' selected')+'>Grades 3-5</option><option value="1"'+(s.upper?' selected':'')+'>Grades 6-8</option></select></label>':'')+(ids.some(function(id){return SKI[id].g==='E'})?'<label class="ck">Grade for picture questions <select class="sel" onchange="setEarly('+si+',+this.value)" aria-label="Grade for picture questions"><option value="0"'+(!s.early?' selected':'')+'>Kindergarten</option><option value="1"'+(s.early===1?' selected':'')+'>Grade 1</option><option value="2"'+(s.early===2?' selected':'')+'>Grade 2</option></select></label>':'')+
  '<details><summary>Interests ('+((s.themes||[]).length)+')</summary><div class="cks">'+THEMES.map(function(t,i){return '<label class="ck"><input type="checkbox" '+((s.themes||[]).indexOf(i)>=0?'checked':'')+' onchange="toggleTheme('+si+','+i+',this.checked)"> '+t.icon+' '+esc(t.name)+'</label>'}).join('')+'</div></details>'+
  '<div class="btns"><button class="btn sm" onclick="prev('+si+')"'+(n?'':' disabled')+'>Preview</button><button class="btn alt sm" onclick="copyLink('+si+')"'+(n?'':' disabled')+'>Copy link</button><button class="btn alt sm" onclick="copyCode('+si+')"'+(n?'':' disabled')+'>Copy code</button><button class="btn dng sm" onclick="del('+si+')">'+(DEL===si?'Click again to remove':'Remove')+'</button></div></div>'});
 if(DB.roster.length)h+='<div class="btns"><button class="btn sm" onclick="copyAll()">Copy all names and codes</button><button class="btn dng sm" onclick="clearAll()">'+(CLR?'Click again to clear everyone':'Clear all students')+'</button></div>';
 h+='</section><section class="card"><h3>3. Follow-up quiz from missed skills</h3><p class="sm">When a student taps “Copy my results,” they send you a note. Paste it here to make a new 10-question quiz with only the skills they missed.</p><textarea id="fu" class="inp full ta" rows="5" oninput="DRAFT.f=this.value" placeholder="Paste the student’s results note here">'+esc(DRAFT.f)+'</textarea><button class="btn" onclick="makeFollow()">Make the follow-up quiz</button></section>';
 h+='<section class="card"><h3>4. Student interests (optional)</h3><p class="sm">Paste one student per line, like “Ava: minecraft, volleyball”. Names must match the students above. Two columns copied from a spreadsheet (name, then interests) work too. Questions will use names, objects, and story scenes from the matching themes.</p><textarea id="ints" class="inp full ta" rows="6" oninput="DRAFT.i=this.value" placeholder="Ava: minecraft, axolotls\nLeo: roblox, soccer">'+esc(DRAFT.i||'')+'</textarea><button class="btn" onclick="applyInterests()">Apply interests</button></section>';
 h+='<section class="card"><details><summary>Pick skills by hand</summary><input id="mn" class="inp full" placeholder="Student name">';
 [0,'E',3,4,5,6,7,8,'R'].forEach(function(g){h+='<details><summary>'+(g==='E'?'Pictures: kindergarten to grade 2':g==='R'?'Reading and language, grades 3-8':g?'Grade '+g+' math':'Kindergarten reading and writing')+'</summary><div class="cks">'+SK.filter(function(s){return s.g===g}).map(function(s){return '<label class="ck"><input type="checkbox" class="mck" value="'+s.id+'"> '+s.icon+' '+(cl(s)?cl(s)+' · ':'')+esc(s.name)+'</label>'}).join('')+'</div></details>'});
 h+='<button class="btn" onclick="addMan()">Save student</button></details></section>';
 h+='<section class="card"><h3>Sharing</h3><p class="sm">A student can paste their <b>code</b> on the start screen. A <b>link</b> opens their quiz directly. Paste this page’s web address here once so links point to the right place:</p><input class="inp full" id="base" value="'+esc(DB.base)+'" placeholder="https://…" onchange="DB.base=this.value.trim();save()"><p class="sm">XP and progress save on the device a student uses. Students copy their results note to send you proof of completion.</p></section></div>';
 return h}
function toggleTheme(si,i,on){var s=DB.roster[si];s.themes=s.themes||[];var k=s.themes.indexOf(i);if(on&&k<0)s.themes.push(i);if(!on&&k>=0)s.themes.splice(k,1);save()}
function applyInterests(){var lines=(DRAFT.i||'').split(/\r?\n/).filter(function(l){return l.trim()}),ok=0,miss=[],none=0;
 lines.forEach(function(l){var nm,rest,k;if((k=l.indexOf(':'))>0){nm=l.slice(0,k);rest=l.slice(k+1)}else if((k=l.indexOf('\t'))>0){nm=l.slice(0,k);rest=l.slice(k+1)}else if((k=l.indexOf(','))>0){nm=l.slice(0,k);rest=l.slice(k+1)}else return;
  nm=nm.trim().toLowerCase();var tg=DB.roster.filter(function(s){var n=s.name.toLowerCase().replace(/ \(follow-up.*\)$/,'');return n===nm||(nm.indexOf(' ')<0&&n.split(' ')[0]===nm)});
  if(!tg.length){miss.push(nm);return}var th=interestsToThemes(rest);if(!th.length)none++;tg.forEach(function(s){s.themes=th});ok++});
 save();render();toast(ok+' student'+(ok===1?'':'s')+' updated'+(miss.length?'. Not found: '+miss.slice(0,3).join(', ')+(miss.length>3?'…':''):'')+(none?'. '+none+' had no matching theme':''))}
function setSRead(si,v){DB.roster[si].read=!!v;save()}
function setEarly(si,v){DB.roster[si].early=v;save()}
function setUpper(si,v){DB.roster[si].upper=!!v;save()}
function rename(si,v){v=v.trim();if(v){DB.roster[si].name=v;save();render()}}
function del(si){if(DEL===si){DB.roster.splice(si,1);DEL=-1;save();render()}else{DEL=si;render();setTimeout(function(){if(DEL===si){DEL=-1;render()}},3000)}}
function clearAll(){if(CLR){DB.roster=[];CLR=false;save();render()}else{CLR=true;render();setTimeout(function(){if(CLR){CLR=false;render()}},3000)}}
function prev(si){var s=DB.roster[si];CUR={name:s.name,rows:s.rows,man:s.man,wt:s.wt,read:s.read,upper:s.upper,early:s.early,themes:s.themes,pv:true};go('intro')}
function link(s){var b=DB.base||location.href.split('#')[0];return b+'#c='+encodeURIComponent(encode(s))}
function copyLink(si){if(!DB.base)toast('Tip: paste this page’s web address under Sharing so links open the right page.');copy(link(DB.roster[si]),'Link copied')}
function copyCode(si){copy(encode(DB.roster[si]),'Code copied')}
function copyAll(){copy(DB.roster.filter(function(s){return skillsOf(s).length}).map(function(s){return s.name+'\t'+encode(s)}).join('\n'),'All codes copied')}
function makeFollow(){var t=DRAFT.f,m=t.match(/follow-up code:\s*([^\n\r]+)/i),st=m?decode(m[1]):null;
 if(!st){var ms=t.match(/missed skills:\s*([^\n\r]+)/i),nm=t.match(/student:\s*([^\n\r]+)/i);if(ms&&nm){var ids=[];SK.forEach(function(s){if(s.codes&&s.codes.some(function(c){return ms[1].toUpperCase().indexOf(c)>=0})&&ids.indexOf(s.id)<0)ids.push(s.id)});if(ids.length)st={name:nm[1].trim(),rows:[],man:ids,wt:{},read:false}}}
 if(!st){toast('I could not find a follow-up code or missed skills in that note.');return}
 var base=st.name.replace(/ \(follow-up.*\)$/,''),k=1,nn;do{nn=base+' (follow-up'+(k>1?' '+k:'')+')';k++}while(DB.roster.some(function(r){return r.name===nn}));
 st.name=nn;DB.roster.push(st);DRAFT.f='';save();render();toast('Follow-up quiz added for '+base)}
function addMan(){var nm=$('mn').value.trim();if(!nm){toast('Type a name first.');return}var ids=[].slice.call(document.querySelectorAll('.mck:checked')).map(function(c){return c.value});if(!ids.length){toast('Check at least one skill.');return}
 var ex=DB.roster.filter(function(s){return s.name.toLowerCase()===nm.toLowerCase()})[0];if(ex){ex.man=ids;ex.rows=[]}else DB.roster.push({name:nm,rows:[],man:ids,wt:{},read:false});save();render();toast('Saved')}

(function init(){var m=location.hash.match(/c=([^&]+)/);if(m){var st;try{st=decode(decodeURIComponent(m[1]))}catch(e){}if(st){login(st);VIEW='intro'}}render()})();

</script>
